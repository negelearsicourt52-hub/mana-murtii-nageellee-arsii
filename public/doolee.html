  --bg:#f5f8fb;
  --white:#fff;
  --line:#dce5ec;
  --shadow:0 12px 35px rgba(12,45,73,.10)
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans",sans-serif;
  background:var(--bg);
  color:#172532;
}
.header{
  background:linear-gradient(135deg,var(--navy),var(--blue));

}
.container{
  max-width:850px;
  margin:45px auto;
  padding:0 20px;
}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:40px;
  box-shadow:var(--shadow);
  text-align:center;
}
.card h2{
  color:var(--navy);
  font-size:28px;
  margin-top:0;
}
.card p{
  color:#617384;
  font-size:17px;
}
.btn{
  display:inline-block;
  margin:12px 6px;
  padding:14px 24px;
  border-radius:9px;
  background:var(--gold);
  color:#18200d;
  font-weight:800;
  text-decoration:none;
  border:1px solid var(--gold);
}
.back{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.meet{
  font-size:18px;
  padding:17px 30px;
}
footer{
  margin-top:60px;
  background:#071f33;
  color:#dfeaf1;
  text-align:center;
  padding:25px;
}
@media(max-width:600px){
  .header h1{font-size:27px}
  .card{padding:28px 20px}
  .btn{
    display:block;
    margin:12px 0;
  }
}
</style>
</head>
